[build-system]
requires = [“setuptools>=68”, “wheel”]
build-backend = “setuptools.build_meta”

[project]
name = “naijapay-backend”
version = “0.1.0”
requires-python = “>=3.12”
dependencies = [
“fastapi>=0.115,<1”,
“uvicorn[standard]>=0.30”,
“pydantic>=2.8”,
“pydantic-settings>=2.4”,
“sqlalchemy[asyncio]>=2.0.32”,
“asyncpg>=0.29”,
“alembic>=1.13”,
“redis>=5.0”,
“celery>=5.4”,
“httpx>=0.27”,
“argon2-cffi>=23.1”,
“pyjwt>=2.9”,
“cryptography>=43”,
]

[project.optional-dependencies]
dev = [
“pytest>=8”,
“pytest-asyncio>=0.23”,
“ruff>=0.5”,
“mypy>=1.11”,
“import-linter>=2.0”,
]

[tool.setuptools.packages.find]
where = [”.”]
include = [“app”, “app.”]
exclude = [“tests”, “tests.”, “migrations”, “migrations.*”]

[tool.pytest.ini_options]
asyncio_mode = “auto”
testpaths = [“tests”]

[tool.ruff]
line-length = 100
target-version = “py312”

[tool.mypy]
python_version = “3.12”
strict = true
plugins = [“pydantic.mypy”]

[tool.importlinter]
root_package = “app”

[[tool.importlinter.contracts]]
name = “ledger is a leaf module”
type = “forbidden”
source_modules = [“app.modules.ledger”]
forbidden_modules = [
“app.modules.wallet”,
“app.modules.transactions”,
“app.modules.payments”,
“app.modules.providers”,
“app.modules.admin”,
“app.modules.notifications”,
]

[[tool.importlinter.contracts]]
name = “core does not import modules”
type = “forbidden”
source_modules = [“app.core”]
forbidden_modules = [“app.modules”]

[[tool.importlinter.contracts]]
name = “other modules use ledger only through its interface”
type = “forbidden”
source_modules = [
“app.modules.wallet”,
“app.modules.auth”,
“app.modules.users”,
“app.modules.payments”,
“app.modules.transactions”,
“app.modules.services”,
“app.modules.providers”,
“app.modules.admin”,
“app.modules.airtime”,
]
forbidden_modules = [
“app.modules.ledger.models”,
“app.modules.ledger.service”,
“app.modules.ledger.accounts”,
“app.modules.ledger.ddl”,
]
allow_indirect_imports = true